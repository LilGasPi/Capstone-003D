name: Build prototipo

on:
  push:
    paths:
      - 'prototipo/**'
      - '.github/workflows/build-prototipo.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'prototipo/**'
      - '.github/workflows/build-prototipo.yml'

jobs:
  build:
    name: Build Next.js
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: prototipo

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: prototipo/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generar Prisma Client
        run: pnpm exec prisma generate

      - name: Ejecutar pruebas automaticas
        run: pnpm test

      - name: Compilar prototipo
        run: pnpm build
